# config.local.yaml 填写模板(复制为 config.local.yaml 后填入真实值)
#
# 用法:
#   cp config.local.example.yaml config.local.yaml
#   # 然后把下面带 < > 的占位符换成你环境的真实值
#
# 优先级:环境变量 DGA_DB_* > config.local.yaml > config.yaml
# ⚠️ config.local.yaml 已在 .gitignore 中,永远不会进 git。
# ⚠️ 不要把填写后的本文件提交、截图或转发。

datasource:
  # 数据库引擎:postgres / mysql / sqlite / duckdb(自定义引擎需在 scripts/db_adapter.py 注册)
  type: postgres
  # 内网 PostgreSQL 地址与端口
  host: "<PG_HOST>"
  port: 5432
  # 库名与只读账号(请务必使用只读账号)
  name: "<DB_NAME>"
  user: "<READONLY_USER>"
  password: "<DB_PASSWORD>"
  # 业务事实表(脱敏保单明细,一行 = 保单 × 产品;不同底座换成对应表名)
  table: policy_detail
  # doctor.py 的行数校验基准(换成新库实际行数)
  verify_total_rows: 721080
